<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d97706" />
    <title>HUEVOS FELICES LOS DIAMANTES</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pedidos Huevos" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body onload="onStart()">
    <div class="app-shell">
      <header class="topbar">
        <div class="title">🥚 HUEVOS FELICES LOS DIAMANTES</div>
        <div class="topbar-right">
          <span id="netStatus" class="net-status hidden" onclick="onNetStatusClick()"></span>
          <div id="sellerProfile" class="seller-profile hidden">
            <span id="sellerName"></span>
            <button class="logout-btn" onclick="logout()" title="Cerrar sesión">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logout-icon"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              <span>Salir</span>
            </button>
          </div>
        </div>
      </header>

      <div id="offlineBanner" class="offline-banner hidden">Sin conexión — trabajando con datos locales. Los cambios se sincronizarán.</div>

      <main class="content">
        <section id="loginScreen" class="screen active-screen">
          <div class="card login-card">
            <div class="login-logo">🥚</div>
            <h2>Iniciar Sesión</h2>
            <label for="loginUser">Usuario</label>
            <select id="loginUser"></select>
            <label for="loginPass">Contraseña</label>
            <input id="loginPass" type="password" placeholder="Tu contraseña" />
            <button class="primary-button" onclick="login()">Ingresar</button>
            <p class="login-note" id="loginNote"></p>
          </div>
        </section>

        <section id="mainScreen" class="screen">
          <div class="tabs" role="tablist">
            <button id="tabButton-new" class="tab-button active" onclick="showTab('new')">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              <span>Nuevo</span>
            </button>
            <button id="tabButton-orders" class="tab-button" onclick="showTab('orders')">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
              <span>Pedidos</span>
            </button>
            <button id="tabButton-clients" class="tab-button" onclick="showTab('clients')">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Clientes</span>
            </button>
            <button id="tabButton-inventory" class="tab-button" onclick="showTab('inventory')">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
              <span>Inventario</span>
            </button>
            <button id="tabButton-reports" class="tab-button" onclick="showTab('reports')">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              <span>Reportes</span>
            </button>
            <button id="tabButton-config" class="tab-button" onclick="showTab('config')">
              <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span>Config</span>
            </button>
          </div>

          <div id="tabContent"></div>
        </section>
      </main>
    </div>

    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal-card" id="modalCard"></div>
    </div>

    <div id="globalLoader" class="loader-overlay hidden">
      <div class="loader-card">
        <div class="spinner"></div>
        <div class="loader-text" id="loaderText">Cargando...</div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
  </body>
</html>
